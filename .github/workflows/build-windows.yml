name: Build iOSFakeRunning

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Build
        run: dotnet build iOSFakeRun/iOSFakeRun.csproj -c Release -o build/iOSFakeRunning
      - name: Get DeveloperDiskImage
        run: git clone https://github.com/Mythologyli/DeveloperDiskImage.git --depth=1 build/iOSFakeRunning/DeveloperDiskImage
      - name: Delete iOS 13 or earlier
        run: cd build/iOSFakeRunning/DeveloperDiskImage && ls -name | select-string -pattern "^1[0-3]\..*?" | %{rm $_ -Recurse -Force -Confirm:$false}
      - name: Delete iOS 9 or earlier
        run: cd build/iOSFakeRunning/DeveloperDiskImage && ls -name | select-string -pattern "^[0-9]\.[0-9].*?" | %{rm $_ -Recurse -Force -Confirm:$false}
      - name: Clean DeveloperDiskImage folder
        run: cd build/iOSFakeRunning/DeveloperDiskImage && rm .git, *.png, *.py, *.md -Recurse -Force -Confirm:$false
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: iOSFakeRunning
          path: build/iOSFakeRunning
